[build]
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBlo5vw62iKEAdqcg3xEY7TwvdPze10VcM"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."daily-kpi-report"]
  schedule = "0 23 * * *"

[functions."weekly-kpi-report"]
  schedule = "0 23 * * 5"

[functions."send-quoted-followup-emails"]
  schedule = "0 15 * * *"

[functions."send-daily-task-digest"]
  schedule = "0 13 * * *"

[functions."send-referral-cadence-emails"]
  schedule = "0 15 * * *"

[functions."send-new-customers-email"]
  schedule = "0 23 * * *"

# 9:00 AM Central = 14:00 UTC (daylight) or 15:00 UTC (standard). Fires at both;
# the handler only proceeds when it's actually 9am Central, so one email/day.
[functions."send-producer-folio-update"]
  schedule = "0 14,15 * * *"
