  <div style="background:#fff;border-radius:10px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden">
    <div style="background:#1B3A5C;padding:14px 20px"><span style="color:#fff;font-size:14px;font-weight:700">Policies Sold Today</span></div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:#f8fafc">
        <th style="padding:8px 12px;text-align:left;color:#64748b;font-weight:600;font-size:11px;border-bottom:1px solid #e2e8f0">Customer</th>
        <th style="padding:8px 12px;text-align:left;color:#64748b;font-weight:600;font-size:11px;border-bottom:1px solid #e2e8f0">Line</th>
        <th style="padding:8px 12px;text-align:left;color:#64748b;font-weight:600;font-size:11px;border-bottom:1px solid #e2e8f0">Premium</th>
        <th style="padding:8px 12px;text-align:left;color:#64748b;font-weight:600;font-size:11px;border-bottom:1px solid #e2e8f0">Producer</th>
      </tr></thead>
      <tbody>${closedRows}</tbody>
    </table>
  </div>

  <div style="text-align:center;color:#94a3b8;font-size:11px;padding:8px 0 16px">
    Sent automatically at 5:00 PM Central &nbsp;·&nbsp; AgencyPro CRM &nbsp;·&nbsp; Allen Insurance Agency &nbsp;·&nbsp; Colleyville, TX
  </div>
</div></body></html>`;

  // ── SEND EMAIL VIA GMAIL SMTP ──
  const transporter = nodemailer.createTransport({
    service: 'gmail',
    auth: {
      user: process.env.GMAIL_USER,
      pass: process.env.GMAIL_APP_PASSWORD,
    },
  });

  await transporter.sendMail({
    from:    `"AgencyPro CRM" <${process.env.GMAIL_USER}>`,
    to:      toEmail,
    subject: `AgencyPro Daily KPI Report — ${fmtDt(today)}`,
    text:    txt,
    html:    html,
  });

  console.log(`[daily-kpi-report] Report sent to ${toEmail} for ${today}`);
  return new Response('OK', { status: 200 });
}
